services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: northline
      POSTGRES_PASSWORD: northline
      POSTGRES_DB: northline
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northline -d northline"]
      interval: 5s
      timeout: 5s
      retries: 10
